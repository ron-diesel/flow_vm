name: Publish to pub.dev

on:
  push:
    tags:
      # Must match v{{version}} in the package's pub.dev admin settings.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    # Includes Flutter setup, dependency resolution, and a publish dry run.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
